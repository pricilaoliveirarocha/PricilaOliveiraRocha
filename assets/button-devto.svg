<svg xmlns="http://www.w3.org/2000/svg" width="118" height="28" viewBox="0 0 118 28" role="img" aria-label="Dev.to">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#1d0920"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff3cac"/>
    </linearGradient>
    <clipPath id="clip"><rect width="118" height="28" rx="7"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="117" height="27" rx="7" fill="url(#bg)" stroke="url(#edge)"/>
  <g clip-path="url(#clip)">
    <rect x="-38" y="0" width="30" height="28" fill="#ff4fb3" opacity=".09" transform="skewX(-18)">
      <animate attributeName="x" from="-38" to="132" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="25" y="8" width="20" height="13" rx="3" fill="none" stroke="#ff4fb3" stroke-width="1.2"/>
  <text x="28" y="17.5" fill="#f8fafc" font-size="6.5" font-weight="700" font-family="Consolas,Menlo,monospace">DEV</text>
  <text x="52" y="18" fill="#f8fafc" font-size="9.5" font-weight="700" letter-spacing="1" font-family="Consolas,Menlo,monospace">DEV.TO</text>
</svg>
