<svg xmlns="http://www.w3.org/2000/svg" width="145" height="42" viewBox="0 0 145 42" role="img" aria-label="Dev.to">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#1d0920"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff3cac"/>
    </linearGradient>
    <clipPath id="clip"><rect width="145" height="42" rx="9"/></clipPath>
  </defs>
  <rect x=".75" y=".75" width="143.5" height="40.5" rx="9" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#clip)">
    <rect x="-46" y="0" width="38" height="42" fill="#ff4fb3" opacity=".09" transform="skewX(-18)">
      <animate attributeName="x" from="-46" to="160" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="27" y="12" width="28" height="18" rx="4" fill="none" stroke="#ff4fb3" stroke-width="1.5"/>
  <text x="31" y="24.5" fill="#f8fafc" font-size="8.5" font-weight="700" font-family="Consolas,Menlo,monospace">DEV</text>
  <text x="63" y="26" fill="#f8fafc" font-size="11.5" font-weight="700" letter-spacing="1.2" font-family="Consolas,Menlo,monospace">DEV.TO</text>
</svg>
