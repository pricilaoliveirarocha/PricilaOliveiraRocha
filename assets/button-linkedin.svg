<svg xmlns="http://www.w3.org/2000/svg" width="145" height="42" viewBox="0 0 145 42" role="img" aria-label="LinkedIn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131e"/>
      <stop offset="1" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="145" height="42" rx="9"/></clipPath>
  </defs>
  <rect x=".75" y=".75" width="143.5" height="40.5" rx="9" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#clip)">
    <rect x="-46" y="0" width="38" height="42" fill="#22d3ee" opacity=".09" transform="skewX(-18)">
      <animate attributeName="x" from="-46" to="160" dur="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="24" y="10" width="25" height="22" rx="4" fill="none" stroke="#53e3ff" stroke-width="1.5"/>
  <text x="29" y="26" fill="#f8fafc" font-size="12" font-weight="700" font-family="Arial,sans-serif">in</text>
  <circle cx="53" cy="10" r="1.6" fill="#53e3ff"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="59" y="26" fill="#f8fafc" font-size="11.5" font-weight="700" letter-spacing="1" font-family="Consolas,Menlo,monospace">LINKEDIN</text>
</svg>
