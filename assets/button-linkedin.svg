<svg xmlns="http://www.w3.org/2000/svg" width="118" height="28" viewBox="0 0 118 28" role="img" aria-label="LinkedIn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131e"/>
      <stop offset="1" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="118" height="28" rx="7"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="117" height="27" rx="7" fill="url(#bg)" stroke="url(#edge)"/>
  <g clip-path="url(#clip)">
    <rect x="-38" y="0" width="30" height="28" fill="#22d3ee" opacity=".09" transform="skewX(-18)">
      <animate attributeName="x" from="-38" to="132" dur="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="20" y="7" width="18" height="15" rx="3" fill="none" stroke="#53e3ff" stroke-width="1.2"/>
  <text x="23.5" y="18" fill="#f8fafc" font-size="9" font-weight="700" font-family="Arial,sans-serif">in</text>
  <circle cx="40.5" cy="7" r="1.2" fill="#53e3ff"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="46" y="18" fill="#f8fafc" font-size="9.5" font-weight="700" letter-spacing=".8" font-family="Consolas,Menlo,monospace">LINKEDIN</text>
</svg>
