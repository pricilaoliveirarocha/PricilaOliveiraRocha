<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="fastfetch-title fastfetch-description">
  <title id="fastfetch-title">Pricila Oliveira technical profile</title>
  <desc id="fastfetch-description">Animated terminal panel listing professional information and software engineering technologies.</desc>

  <defs>
    <!-- PALETTE: only black, neon pink, white and neutral gray. -->
    <linearGradient id="pinkLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#FF10F0"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="pinkField" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FF1493" stroke-opacity=".04"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="1" y="1" width="998" height="408" rx="16"/>
    </clipPath>
    <!-- COMMAND REVEAL: increase the width if the command text is changed. -->
    <clipPath id="commandReveal">
      <rect x="424" y="12" width="0" height="24">
        <animate attributeName="width" from="0" to="205" begin=".45s" dur=".9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- TERMINAL SHELL -->
  <rect x=".75" y=".75" width="998.5" height="408.5" rx="16" fill="#0D1117" stroke="#57102E" stroke-width="1.5"/>
  <g clip-path="url(#panelClip)">
    <rect x="1" y="1" width="998" height="408" fill="url(#grid)"/>
    <ellipse cx="500" cy="210" rx="480" ry="280" fill="url(#pinkField)">
      <animate attributeName="opacity" values=".45;.8;.45" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-170" y="42" width="130" height="323" fill="#FF1493" opacity=".02" transform="skewX(-13)">
      <animate attributeName="x" from="-170" to="1130" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- WINDOW BAR -->
  <path d="M0 43H1000M0 365H1000" stroke="#8B949E" stroke-opacity=".27"/>
  <circle cx="24" cy="22" r="6" fill="#FF1493"/>
  <circle cx="43" cy="22" r="6" fill="#FF1493" fill-opacity=".62"/>
  <circle cx="62" cy="22" r="6" fill="#FF1493" fill-opacity=".28"/>
  <text x="420" y="28" text-anchor="end" fill="#8B949E" font-family="Consolas,Menlo,monospace" font-size="13">pricila@github:~$</text>
  <g clip-path="url(#commandReveal)">
    <text x="430" y="28" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="13">fastfetch</text>
  </g>

  <!-- PROFILE PROMPT -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur=".7s" fill="freeze"/>
    <rect x="22" y="65" width="3" height="42" rx="1.5" fill="#FF10F0" filter="url(#softGlow)"/>
    <!-- EDIT HERE: terminal username. -->
    <text x="42" y="94" fill="#FF1493" font-family="Consolas,Menlo,monospace" font-size="25" font-weight="700" filter="url(#softGlow)">pricila@github</text>
    <rect x="252" y="73" width="3" height="25" fill="#FF10F0">
      <animate attributeName="opacity" values="1;.15;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- COLUMN GUIDES -->
  <path d="M36 119H468M532 119H964" stroke="url(#pinkLine)" stroke-opacity=".55"/>
  <path d="M500 127V342" stroke="#8B949E" stroke-opacity=".34" stroke-dasharray="4 7"/>

  <!-- LEFT COLUMN: professional profile. -->
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.65s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: role. -->
    <text x="42" y="158" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">ROLE</text>
    <text x="180" y="158" fill="#FFFFFF" font-size="15">Software Engineer Intern</text>
  </g>
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.95s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: company. -->
    <text x="42" y="207" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">COMPANY</text>
    <text x="180" y="207" fill="#FFFFFF" font-size="15">A2 Solutions</text>
  </g>
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.25s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: education. -->
    <text x="42" y="256" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">EDUCATION</text>
    <text x="180" y="256" fill="#FFFFFF" font-size="14.5">Software Engineering · In Progress</text>
  </g>
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.55s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: location. -->
    <text x="42" y="305" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">LOCATION</text>
    <text x="180" y="305" fill="#FFFFFF" font-size="15">Rio de Janeiro · Brazil</text>
  </g>

  <!-- RIGHT COLUMN: technical stack. -->
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: backend technologies. -->
    <text x="535" y="158" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">BACKEND</text>
    <text x="680" y="158" fill="#FFFFFF" font-size="14">PHP · Python · JavaScript · Node.js</text>
  </g>
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: data technologies. -->
    <text x="535" y="207" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">DATA</text>
    <text x="680" y="207" fill="#FFFFFF" font-size="14">SQL · MySQL · SQL Server</text>
  </g>
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: frontend technologies. -->
    <text x="535" y="256" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">FRONTEND</text>
    <text x="680" y="256" fill="#FFFFFF" font-size="14">Vue · React · Bootstrap</text>
  </g>
  <g font-family="Consolas,Menlo,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur=".7s" fill="freeze"/>
    <!-- EDIT HERE: subjects currently being explored. -->
    <text x="535" y="305" fill="#FF1493" font-size="14" font-weight="700" letter-spacing="2.6">EXPLORING</text>
    <text x="680" y="299" fill="#FFFFFF" font-size="13.4">Artificial Intelligence · Machine Learning</text>
    <text x="680" y="321" fill="#8B949E" font-size="13.4">Data Science</text>
  </g>

  <!-- BOTTOM PROMPT -->
  <text x="26" y="394" fill="#FF1493" font-family="Consolas,Menlo,monospace" font-size="14">pricila<tspan fill="#8B949E">@github:~$ </tspan></text>
  <rect x="169" y="378" width="9" height="18" rx="1" fill="#FF10F0" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;.12;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</svg>
