<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="420"
  viewBox="0 0 1000 420"
  role="img"
  aria-label="Technical profile of Pricila Oliveira"
  font-family="Consolas,Menlo,monospace"
>
  <defs>
    <!-- PALETA: fundo escuro do painel. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712" />
      <stop offset=".62" stop-color="#0b1022" />
      <stop offset="1" stop-color="#170820" />
    </linearGradient>

    <!-- PALETA: bordas e detalhes neon. -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset=".5" stop-color="#7c3aed" stop-opacity=".45" />
      <stop offset="1" stop-color="#ff3cac" />
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset=".5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#ff3cac" />
    </linearGradient>

    <!-- GRID ANIMADO: altere dur para controlar a velocidade. -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path
        d="M30 0H0V30"
        fill="none"
        stroke="#53e3ff"
        stroke-opacity=".04"
      />
      <animateTransform
        attributeName="patternTransform"
        type="translate"
        from="0 0"
        to="30 30"
        dur="12s"
        repeatCount="indefinite"
      />
    </pattern>

    <!-- Efeito de brilho usado no nome de usuário. -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Limita as animações às bordas arredondadas do painel. -->
    <clipPath id="panel">
      <rect width="1000" height="420" rx="15" />
    </clipPath>
  </defs>

  <!-- FUNDO PRINCIPAL -->
  <rect
    x=".75"
    y=".75"
    width="998.5"
    height="418.5"
    rx="15"
    fill="url(#bg)"
    stroke="url(#border)"
    stroke-width="1.5"
  />

  <!-- CAMADA ANIMADA: grid e faixa de varredura. -->
  <g clip-path="url(#panel)">
    <rect x="1" y="1" width="998" height="418" rx="14" fill="url(#grid)" />
    <rect
      x="-200"
      y="36"
      width="170"
      height="354"
      fill="url(#border)"
      opacity=".035"
      transform="skewX(-14)"
    >
      <animate
        attributeName="x"
        from="-200"
        to="1120"
        dur="12s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <!-- DIVISORES DO TERMINAL -->
  <path d="M0 38H1000M0 390H1000" stroke="#23304e" />
  <rect x="18" y="54" width="2" height="314" rx="1" fill="url(#rail)" opacity=".9" />

  <!-- BOTÕES DA JANELA -->
  <circle cx="20" cy="19" r="5" fill="#ff5f57" />
  <circle cx="36" cy="19" r="5" fill="#febc2e" />
  <circle cx="52" cy="19" r="5" fill="#28c840" />

  <!-- EDITE AQUI: usuário exibido na barra superior. -->
  <text x="500" y="24" text-anchor="middle" font-size="12.5" fill="#94a3b8">
    pricila@github: ~ $ fastfetch
  </text>

  <!-- EDITE AQUI: usuário exibido no título do perfil. -->
  <g filter="url(#softGlow)">
    <circle cx="35" cy="67" r="3" fill="#22d3ee">
      <animate
        attributeName="opacity"
        values="1;.3;1"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </circle>
    <text x="50" y="73" font-size="19" font-weight="700" fill="#ff4fb3">
      pri@github
    </text>
  </g>

  <!-- Linhas que organizam as duas colunas. -->
  <path d="M34 92H474M526 92H966" stroke="url(#border)" stroke-opacity=".7" />
  <path d="M500 102V246" stroke="#334155" stroke-dasharray="3 7" />

  <!-- RÓTULOS: coluna profissional à esquerda. -->
  <g fill="#53e3ff" font-size="12.5" font-weight="700" letter-spacing=".5">
    <text x="34" y="126">R O L E</text>
    <text x="34" y="160">C O M P A N Y</text>
    <text x="34" y="194">E D U C A T I O N </text>
    <text x="34" y="228">L O C A T I O N </text>

    <!-- RÓTULOS: coluna técnica à direita. -->
    <text x="526" y="126">B A C K E N D</text>
    <text x="526" y="160">D A T A</text>
    <text x="526" y="194">F R O N T E N D</text>
    <text x="526" y="228">N O W   D E E P I N G   I N</text>
  </g>

  <!--
    EDITE AQUI: dados profissionais e técnicos.
    Dentro de textos SVG, escreva &amp; no lugar do caractere "e comercial".
  -->
  <g fill="#f1f5f9" font-size="13.5">
    <!-- Coluna esquerda: cargo, empresa, formação e localização. -->
    <text x="164" y="126">Intern Software Engineer</text>
    <text x="164" y="160">A2 Solutions</text>
    <text x="164" y="194">Gaduating in Software Engineering & Graduated in Analysis and Development of Systems</text>
    <text x="164" y="228">Rio de Janeiro - RJ</text>

    <!-- Coluna direita: tecnologias, dados, frontend e estudos. -->
    <text x="650" y="126">PHP, Python, Javascript & Typescript, Node.js</text> <!-- BACK-END -->
    <text x="650" y="160">SQL, MySQL, PostgreSQL</text> <!-- DATABASE -->
    <text x="650" y="194">JQuery, Vue, React, Bootstrap 5</text> <!-- FRAMEWORKS AND LIBRARIES -->
    <text x="650" y="228">IA, Machine Learning & Bigdata</text> <!-- CURRENTLY STUDYS -->
  </g>


  <!-- DETALHE ANIMADO no canto inferior direito. -->
  <g opacity=".65">
    <circle cx="945" cy="274" r="3" fill="#22d3ee">
      <animate
        attributeName="r"
        values="2;5;2"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>
    <path
      d="M945 274H966V353H918"
      fill="none"
      stroke="url(#border)"
      stroke-dasharray="4 6"
    >
      <animate
        attributeName="stroke-dashoffset"
        from="20"
        to="0"
        dur="2s"
        repeatCount="indefinite"
      />
    </path>
  </g>

  <!-- EDITE AQUI: texto do prompt inferior. -->
  <text x="30" y="410" fill="#ff4fb3" font-size="13.5">
    pricila<tspan fill="#dbeafe">@github:~ $ </tspan><tspan fill="#c4b5fd">hello, world.</tspan>
  </text>

  <!-- Cursor piscante do terminal. -->
  <rect x="361" y="397" width="8" height="15" rx="1" fill="#22d3ee">
    <animate
      attributeName="opacity"
      values="1;.2;1"
      dur="1.2s"
      repeatCount="indefinite"
    />
  </rect>
</svg>
