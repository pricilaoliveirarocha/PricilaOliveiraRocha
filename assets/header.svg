<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title description">
  <title id="title">Pricila Oliveira</title>
  <desc id="description">Neon technical header displaying the name Pricila Oliveira.</desc>
  <defs>
    <!-- MASTER TIMELINE: all looping effects use an 8-second cycle. -->
    <!-- EDIT COLORS HERE -->
    <linearGradient id="pinkStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#FF10F0"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="pinkField">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#FF1493" stroke-opacity=".045"/>
    </pattern>
    <filter id="pinkGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameReveal">
      <rect x="100" y="38" width="0" height="70">
        <animate attributeName="width" from="0" to="800" begin=".9s" dur="1.25s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      </rect>
    </clipPath>
    <clipPath id="heroClip"><rect x="1" y="1" width="998" height="149" rx="5"/></clipPath>
  </defs>

  <!-- HERO PANEL -->
  <rect x=".75" y=".75" width="998.5" height="148.5" rx="5" fill="#080B11" stroke="#FF1493" stroke-width="1.5"/>
  <g clip-path="url(#heroClip)">
    <rect x="1" y="1" width="998" height="148" fill="url(#grid)"/>
    <ellipse cx="500" cy="75" rx="460" ry="145" fill="url(#pinkField)">
      <animate attributeName="opacity" values=".55;1;.55" begin="0s" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-170" y="1" width="120" height="148" fill="#FF1493" opacity=".035" transform="skewX(-15)">
      <animate attributeName="x" from="-170" to="1120" begin="0s" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- OUTER TECHNICAL FRAME -->
  <g fill="none" stroke="url(#pinkStroke)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M18 38V15H220L239 4H450" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".1s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M550 4H761L780 15H982V38" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".1s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M18 112V136H220L239 149H450" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".25s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M550 149H761L780 136H982V112" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".25s" dur="1.2s" fill="freeze"/>
    </path>
  </g>

  <!-- INNER FRAME AND DECORATIVE CORNERS -->
  <path d="M36 43V30H205L218 20H392M608 20H782L795 30H964V43M36 107V120H205L218 130H392M608 130H782L795 120H964V107" fill="none" stroke="#FF1493" stroke-opacity=".48"/>
  <path d="M42 48H56L42 62ZM42 68H56L42 82ZM944 72H958L944 86ZM944 92H958L944 106Z" fill="#FF1493" filter="url(#pinkGlow)"/>
  <path d="M90 29H198M802 29H910M90 120H198M802 120H910" stroke="#8B949E" stroke-opacity=".3"/>

  <!-- CENTRAL STATUS NODE -->
  <g transform="translate(500 13)">
    <circle r="10" fill="#080B11" stroke="#FF1493" stroke-opacity=".6"/>
    <circle r="4" fill="#FF1493" filter="url(#pinkGlow)">
      <animate attributeName="opacity" values=".4;1;.4" begin="0s" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- EDIT HERE: NAME SHOWN IN THE HEADER -->
  <g clip-path="url(#nameReveal)" filter="url(#pinkGlow)">
    <text x="500" y="96" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="38" font-weight="700" letter-spacing="4">PRICILA OLIVEIRA ROCHA</text>
  </g>
</svg>
