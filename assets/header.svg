<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="245" viewBox="0 0 1000 245" role="img" aria-labelledby="title description">
  <title id="title">Pricila Oliveira</title>
  <desc id="description">Neon technical header with Portfolio, Dev.to and LinkedIn buttons.</desc>
  <defs>
    <!-- EDIT COLORS HERE -->
    <linearGradient id="pinkStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#FF10F0"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="pinkField">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#FF1493" stroke-opacity=".045"/>
    </pattern>
    <filter id="pinkGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-100%" width="220%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameReveal">
      <rect x="175" y="49" width="0" height="76">
        <animate attributeName="width" from="0" to="620" begin=".9s" dur="1.25s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      </rect>
    </clipPath>
    <clipPath id="heroClip"><rect x="1" y="1" width="998" height="174" rx="5"/></clipPath>
  </defs>

  <!-- HERO PANEL -->
  <rect x=".75" y=".75" width="998.5" height="174.5" rx="5" fill="#080B11" stroke="#FF1493" stroke-width="1.5"/>
  <g clip-path="url(#heroClip)">
    <rect x="1" y="1" width="998" height="174" fill="url(#grid)"/>
    <ellipse cx="500" cy="87" rx="460" ry="170" fill="url(#pinkField)">
      <animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-170" y="1" width="120" height="174" fill="#FF1493" opacity=".035" transform="skewX(-15)">
      <animate attributeName="x" from="-170" to="1120" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- OUTER TECHNICAL FRAME -->
  <g fill="none" stroke="url(#pinkStroke)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M18 38V15H220L239 4H450" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".1s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M550 4H761L780 15H982V38" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".1s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M18 137V161H220L239 174H450" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".25s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M550 174H761L780 161H982V137" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".25s" dur="1.2s" fill="freeze"/>
    </path>
  </g>

  <!-- INNER FRAME AND DECORATIVE CORNERS -->
  <path d="M36 49V30H205L218 20H392M608 20H782L795 30H964V49M36 126V145H205L218 155H392M608 155H782L795 145H964V126" fill="none" stroke="#FF1493" stroke-opacity=".48"/>
  <path d="M42 53H56L42 67ZM42 73H56L42 87ZM944 97H958L944 111ZM944 117H958L944 131Z" fill="#FF1493" filter="url(#pinkGlow)"/>
  <path d="M90 29H198M802 29H910M90 145H198M802 145H910" stroke="#8B949E" stroke-opacity=".3"/>

  <!-- CENTRAL STATUS NODE -->
  <g transform="translate(500 13)">
    <circle r="10" fill="#080B11" stroke="#FF1493" stroke-opacity=".6"/>
    <circle r="4" fill="#FF1493" filter="url(#pinkGlow)">
      <animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- EDIT HERE: NAME SHOWN IN THE HEADER -->
  <g clip-path="url(#nameReveal)" filter="url(#pinkGlow)">
    <text x="500" y="112" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="48" font-weight="700" letter-spacing="5">PRICILA OLIVEIRA</text>
  </g>

  <!-- BUTTON ROW: links and labels can be edited here. -->
  <a href="https://www.pricilaoliveirarocha.com.br/" xlink:href="https://www.pricilaoliveirarocha.com.br/" target="_blank">
    <g>
      <rect x="92.75" y="195.75" width="259.5" height="42.5" rx="8" fill="#0D1117" stroke="#FF1493" stroke-width="1.5"/>
      <path d="M133 208L126 217L133 226M143 208L150 217L143 226M141 206L135 228" fill="none" stroke="#FF1493" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pinkGlow)"/>
      <text x="222" y="222" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1.3">PORTFOLIO</text>
      <path d="M333 212L338 217L333 222" fill="none" stroke="#FF1493" stroke-width="1.8"/>
      <rect x="93" y="196" width="0" height="42" rx="8" fill="#FF1493" opacity=".07">
        <animate attributeName="width" values="0;259;0" dur="5.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </a>

  <a href="https://dev.to/pricilaoliveirarocha" xlink:href="https://dev.to/pricilaoliveirarocha" target="_blank">
    <g>
      <rect x="370.75" y="195.75" width="259.5" height="42.5" rx="8" fill="#0D1117" stroke="#FF1493" stroke-width="1.5"/>
      <rect x="408" y="206" width="27" height="22" rx="3" fill="none" stroke="#FF1493" stroke-width="2" filter="url(#pinkGlow)"/>
      <text x="421.5" y="221" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="8.5" font-weight="700">DEV</text>
      <text x="500" y="222" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1.3">DEV.TO</text>
      <path d="M611 212L616 217L611 222" fill="none" stroke="#FF1493" stroke-width="1.8"/>
    </g>
  </a>

  <a href="https://www.linkedin.com/in/pricilaoliveirarocha/" xlink:href="https://www.linkedin.com/in/pricilaoliveirarocha/" target="_blank">
    <g>
      <rect x="648.75" y="195.75" width="259.5" height="42.5" rx="8" fill="#0D1117" stroke="#53E3FF" stroke-width="1.5"/>
      <rect x="687" y="206" width="23" height="22" rx="3" fill="none" stroke="#D9F8FF" stroke-width="2" filter="url(#cyanGlow)"/>
      <text x="698.5" y="222" text-anchor="middle" fill="#D9F8FF" font-family="Arial,sans-serif" font-size="13.5" font-weight="700">in</text>
      <text x="778" y="222" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1.3">LINKEDIN</text>
      <path d="M889 212L894 217L889 222" fill="none" stroke="#FF1493" stroke-width="1.8"/>
    </g>
  </a>
</svg>
