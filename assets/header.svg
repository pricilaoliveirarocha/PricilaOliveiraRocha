<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="header-title header-description">
  <title id="header-title">Pricila Oliveira — Software Engineer</title>
  <desc id="header-description">Futuristic neon-pink profile header with animated technical frame.</desc>

  <defs>
    <!-- PALETTE: only black, neon pink, white and neutral gray. -->
    <linearGradient id="pinkLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#FF10F0"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity=".35"/>
    </linearGradient>

    <!-- BACKGROUND: restrained pink light, without multicolor gradients. -->
    <radialGradient id="pinkField" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".12"/>
      <stop offset=".58" stop-color="#FF1493" stop-opacity=".035"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#FF1493" stroke-opacity=".045"/>
    </pattern>

    <!-- SOFT GLOW: intentionally subtle for GitHub dark and light themes. -->
    <filter id="softGlow" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- NAME REVEAL: this rectangle expands once from left to right. -->
    <clipPath id="nameReveal">
      <rect x="215" y="68" width="0" height="65">
        <animate attributeName="width" from="0" to="570" begin="1.05s" dur="1.25s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      </rect>
    </clipPath>

    <clipPath id="panelClip">
      <rect x="1" y="1" width="998" height="228" rx="16"/>
    </clipPath>
  </defs>

  <!-- PANEL BACKGROUND -->
  <rect x=".75" y=".75" width="998.5" height="228.5" rx="16" fill="#0D1117" stroke="#57102E" stroke-width="1.5"/>
  <g clip-path="url(#panelClip)">
    <rect x="1" y="1" width="998" height="228" fill="url(#grid)"/>
    <ellipse cx="500" cy="115" rx="430" ry="170" fill="url(#pinkField)">
      <animate attributeName="opacity" values=".55;.9;.55" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Slow scan line; it remains low contrast and never covers the text. -->
    <rect x="-160" y="1" width="120" height="228" fill="#FF1493" opacity=".025" transform="skewX(-15)">
      <animate attributeName="x" from="-160" to="1120" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- TECHNICAL FRAME: drawn once when the SVG loads. -->
  <g fill="none" stroke="url(#pinkLine)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 58V33H220L239 19H410" stroke-dasharray="410" stroke-dashoffset="410">
      <animate attributeName="stroke-dashoffset" from="410" to="0" begin=".1s" dur="1.3s" fill="freeze"/>
    </path>
    <path d="M590 19H761L780 33H962V58" stroke-dasharray="410" stroke-dashoffset="410">
      <animate attributeName="stroke-dashoffset" from="410" to="0" begin=".1s" dur="1.3s" fill="freeze"/>
    </path>
    <path d="M38 172V197H220L239 211H410" stroke-dasharray="410" stroke-dashoffset="410">
      <animate attributeName="stroke-dashoffset" from="410" to="0" begin=".25s" dur="1.3s" fill="freeze"/>
    </path>
    <path d="M590 211H761L780 197H962V172" stroke-dasharray="410" stroke-dashoffset="410">
      <animate attributeName="stroke-dashoffset" from="410" to="0" begin=".25s" dur="1.3s" fill="freeze"/>
    </path>
  </g>

  <!-- CORNER MARKERS -->
  <path d="M38 48V33H53M962 48V33H947M38 182V197H53M962 182V197H947" fill="none" stroke="#FF1493" stroke-width="2"/>
  <path d="M70 49H188M812 49H930M70 181H188M812 181H930" stroke="#8B949E" stroke-opacity=".28"/>

  <!-- CENTRAL STATUS INDICATOR -->
  <g transform="translate(500 19)">
    <circle r="10" fill="none" stroke="#FF1493" stroke-opacity=".4"/>
    <circle r="3.5" fill="#FF10F0" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- EDIT HERE: main name. -->
  <g clip-path="url(#nameReveal)" filter="url(#softGlow)">
    <text x="500" y="120" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="47" font-weight="700" letter-spacing="5">PRICILA OLIVEIRA</text>
  </g>

  <!-- EDIT HERE: professional title. -->
  <text x="500" y="157" text-anchor="middle" fill="#FF1493" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="6" opacity="0">SOFTWARE ENGINEER
    <animate attributeName="opacity" from="0" to="1" begin="2.05s" dur=".75s" fill="freeze"/>
  </text>

  <!-- EDIT HERE: professional motto. -->
  <text x="500" y="190" text-anchor="middle" fill="#FFFFFF" fill-opacity=".76" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="4.2" opacity="0">CODE · LEARN · BUILD · EVOLVE
    <animate attributeName="opacity" from="0" to="1" begin="2.45s" dur=".8s" fill="freeze"/>
  </text>

  <!-- Small looping signal after the entrance animation. -->
  <path d="M410 173H590" stroke="#FF1493" stroke-width="1" stroke-opacity=".25"/>
  <rect x="410" y="172" width="34" height="2" rx="1" fill="#FF10F0" opacity=".7">
    <animate attributeName="x" values="410;556;410" dur="5s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;.9;.25" dur="5s" begin="3s" repeatCount="indefinite"/>
  </rect>
</svg>
