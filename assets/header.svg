<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Pricila Oliveira — Desenvolvedora Back-end, APIs REST, Integrações ERP e Dados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset=".52" stop-color="#0b1024"/><stop offset="1" stop-color="#11091d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#53e3ff"/><stop offset=".48" stop-color="#a855f7"/><stop offset="1" stop-color="#ff4fb3"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#53e3ff" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="panel"><rect width="1000" height="180" rx="18"/></clipPath>
  </defs>
  <rect x=".75" y=".75" width="998.5" height="178.5" rx="18" fill="url(#bg)" stroke="#253253" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="178" rx="17" fill="url(#grid)"/>
  <path d="M24 28H210L226 16H774L790 28H976" fill="none" stroke="url(#accent)" stroke-opacity=".75"/>
  <path d="M24 152H210L226 164H774L790 152H976" fill="none" stroke="url(#accent)" stroke-opacity=".75"/>
  <path d="M24 45V28H41M976 45V28H959M24 135V152H41M976 135V152H959" fill="none" stroke="#53e3ff" stroke-opacity=".55"/>
  <g filter="url(#glow)"><circle cx="500" cy="18" r="2" fill="#a855f7"/><text x="500" y="92" text-anchor="middle" fill="url(#title)" font-size="45" font-weight="700" letter-spacing="3" font-family="Consolas,Menlo,monospace">PRICILA OLIVEIRA</text></g>
  <text x="500" y="124" text-anchor="middle" fill="#ff66bd" font-size="16" letter-spacing="1.25" font-family="Consolas,Menlo,monospace">DESENVOLVEDORA BACK-END / APIs REST / INTEGRAÇÕES ERP / DADOS</text>
  <g clip-path="url(#panel)" opacity=".28">
    <rect x="-180" y="27" width="160" height="1" fill="url(#accent)"><animate attributeName="x" from="-180" to="1020" dur="14s" repeatCount="indefinite"/></rect>
    <rect x="-240" y="151" width="160" height="1" fill="url(#accent)"><animate attributeName="x" from="-240" to="1020" dur="17s" repeatCount="indefinite"/></rect>
  </g>
</svg>
