<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title description">
  <title id="title">Pricila Oliveira — Software Engineer</title>
  <desc id="description">Neon technical header with Portfolio, Dev.to and LinkedIn buttons.</desc>
  <defs>
    <!-- EDIT COLORS HERE -->
    <linearGradient id="pinkStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#FF10F0"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="pinkField">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#FF1493" stroke-opacity=".045"/>
    </pattern>
    <filter id="pinkGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-100%" width="220%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameReveal">
      <rect x="190" y="63" width="0" height="66">
        <animate attributeName="width" from="0" to="620" begin=".9s" dur="1.25s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      </rect>
    </clipPath>
    <clipPath id="heroClip"><rect x="1" y="1" width="998" height="214" rx="5"/></clipPath>
  </defs>

  <!-- HERO PANEL -->
  <rect x=".75" y=".75" width="998.5" height="214.5" rx="5" fill="#080B11" stroke="#FF1493" stroke-width="1.5"/>
  <g clip-path="url(#heroClip)">
    <rect x="1" y="1" width="998" height="214" fill="url(#grid)"/>
    <ellipse cx="500" cy="107" rx="460" ry="195" fill="url(#pinkField)">
      <animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-170" y="1" width="120" height="214" fill="#FF1493" opacity=".035" transform="skewX(-15)">
      <animate attributeName="x" from="-170" to="1120" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- OUTER TECHNICAL FRAME -->
  <g fill="none" stroke="url(#pinkStroke)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M18 38V15H220L239 4H450" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".1s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M550 4H761L780 15H982V38" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".1s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M18 177V201H220L239 214H450" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".25s" dur="1.2s" fill="freeze"/>
    </path>
    <path d="M550 214H761L780 201H982V177" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin=".25s" dur="1.2s" fill="freeze"/>
    </path>
  </g>

  <!-- INNER FRAME AND DECORATIVE CORNERS -->
  <path d="M36 49V30H205L218 20H392M608 20H782L795 30H964V49M36 166V185H205L218 195H392M608 195H782L795 185H964V166" fill="none" stroke="#FF1493" stroke-opacity=".48"/>
  <path d="M42 63H56L42 77ZM42 83H56L42 97ZM944 137H958L944 151ZM944 157H958L944 171Z" fill="#FF1493" filter="url(#pinkGlow)"/>
  <path d="M90 29H198M802 29H910M90 185H198M802 185H910" stroke="#8B949E" stroke-opacity=".3"/>

  <!-- CENTRAL STATUS NODE -->
  <g transform="translate(500 13)">
    <circle r="10" fill="#080B11" stroke="#FF1493" stroke-opacity=".6"/>
    <circle r="4" fill="#FF1493" filter="url(#pinkGlow)">
      <animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- EDIT HERE: HEADER TEXT -->
  <g clip-path="url(#nameReveal)" filter="url(#pinkGlow)">
    <text x="500" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="43" font-weight="700" letter-spacing="5">PRICILA OLIVEIRA</text>
  </g>
  <text x="500" y="143" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="17" letter-spacing="6" opacity="0">SOFTWARE ENGINEER
    <animate attributeName="opacity" from="0" to="1" begin="1.85s" dur=".65s" fill="freeze"/>
  </text>
  <text x="500" y="184" text-anchor="middle" fill="#FFB8DE" font-family="Consolas,Menlo,monospace" font-size="12.5" letter-spacing="4.5" opacity="0">CODE · LEARN · BUILD · EVOLVE
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur=".7s" fill="freeze"/>
  </text>

  <!-- BUTTON ROW: links and labels can be edited here. -->
  <a href="https://www.pricilaoliveirarocha.com.br/" xlink:href="https://www.pricilaoliveirarocha.com.br/" target="_blank">
    <g>
      <rect x="0.75" y="235.75" width="318.5" height="58.5" rx="10" fill="#0D1117" stroke="#FF1493" stroke-width="1.5"/>
      <path d="M79 256L68 265L79 274M91 256L102 265L91 274M88 252L82 278" fill="none" stroke="#FF1493" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#pinkGlow)"/>
      <text x="165" y="270" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="1.5">PORTFOLIO</text>
      <path d="M288 258L295 265L288 272" fill="none" stroke="#FF1493" stroke-width="2"/>
      <rect x="1" y="236" width="0" height="58" rx="10" fill="#FF1493" opacity=".07">
        <animate attributeName="width" values="0;318;0" dur="5.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </a>

  <a href="https://dev.to/pricilaoliveirarocha" xlink:href="https://dev.to/pricilaoliveirarocha" target="_blank">
    <g>
      <rect x="340.75" y="235.75" width="318.5" height="58.5" rx="10" fill="#0D1117" stroke="#FF1493" stroke-width="1.5"/>
      <rect x="416" y="251" width="34" height="28" rx="4" fill="none" stroke="#FF1493" stroke-width="2.5" filter="url(#pinkGlow)"/>
      <text x="433" y="270" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="11" font-weight="700">DEV</text>
      <text x="517" y="270" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="1.5">DEV.TO</text>
      <path d="M628 258L635 265L628 272" fill="none" stroke="#FF1493" stroke-width="2"/>
    </g>
  </a>

  <a href="https://www.linkedin.com/in/pricilaoliveirarocha/" xlink:href="https://www.linkedin.com/in/pricilaoliveirarocha/" target="_blank">
    <g>
      <rect x="680.75" y="235.75" width="318.5" height="58.5" rx="10" fill="#0D1117" stroke="#53E3FF" stroke-width="1.5"/>
      <rect x="757" y="251" width="29" height="28" rx="3" fill="none" stroke="#D9F8FF" stroke-width="2.4" filter="url(#cyanGlow)"/>
      <text x="771.5" y="271" text-anchor="middle" fill="#D9F8FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">in</text>
      <text x="858" y="270" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="1.5">LINKEDIN</text>
      <path d="M968 258L975 265L968 272" fill="none" stroke="#FF1493" stroke-width="2"/>
    </g>
  </a>
</svg>
