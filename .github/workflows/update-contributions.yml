name: Update contribution graph

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-contributions.mjs"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: update-contribution-graph
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution graph
        env:
          GITHUB_USERNAME: pricilaoliveirarocha
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: node scripts/generate-contributions.mjs

      - name: Commit updated graph
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "Contribution graph is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: update contribution graph"
          git push
